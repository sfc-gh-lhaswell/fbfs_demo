# Runs on every pull request: DCM plan + contract check, posted as a PR comment.
name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet snowflake-cli pyyaml

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat > ~/.snowflake/config.toml <<EOF
          [connections.default]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "~/.snowflake/rsa_key.p8"
          role = "DCM_DEV_DEPLOYER"
          warehouse = "FBL_DEMO_WH"
          EOF
          chmod 600 ~/.snowflake/config.toml

      # DCM: show exactly what would change in Snowflake
      - name: DCM plan (DEV)
        run: snow dcm plan --target DEV 2>&1 | tee /tmp/plan.txt

      # Contract check: is this change safe for consumers?
      - name: Contract check
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          set -o pipefail
          python scripts/check_contracts.py | tee /tmp/contracts.md

      # Consumer notification: post results on the PR
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return '_not available_'; } };
            const plan = read('/tmp/plan.txt').replace(/\x1b\[[0-9;]*m/g, '').slice(-6000);
            const body = `## DCM Plan (DEV)\n\n${read('/tmp/contracts.md')}\n\n` +
              `<details><summary>Snowflake changes from <code>snow dcm plan</code></summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n` +
              `_Commit ${context.sha.substring(0, 7)}_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith('## DCM Plan (DEV)'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
