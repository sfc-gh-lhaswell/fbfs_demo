# Runs when a version tag (v1.2.3) is pushed.
# The same release goes to DEV automatically, then to TEST after approval.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/deploy.yml
    with: { target: DEV, role: DCM_DEV_DEPLOYER, environment: dev }
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/deploy.yml
    with: { target: TEST, role: DCM_TEST_DEPLOYER, environment: test }   # 'test' env has Required reviewers
    secrets: inherit
