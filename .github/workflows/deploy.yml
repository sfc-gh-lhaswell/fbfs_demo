# Push a tag like v1.0.0 -> runs setup.sql in DEV, then TEST after approval.
name: Deploy

on:
  push:
    tags: ['v*']

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet snowflake-cli
      - run: |
          echo "$SNOWFLAKE_PRIVATE_KEY" > key.p8
          snow sql -f setup.sql -D ENV=DEV --temporary-connection \
            --account "$(echo $SNOWFLAKE_ACCOUNT)" --user "$(echo $SNOWFLAKE_USER)" \
            --authenticator SNOWFLAKE_JWT --private-key-file key.p8 \
            --role DCM_DEV_DEPLOYER --warehouse FBL_DEMO_WH
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

  test:
    needs: dev
    runs-on: ubuntu-latest
    environment: test        # waits for your approval
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet snowflake-cli
      - run: |
          echo "$SNOWFLAKE_PRIVATE_KEY" > key.p8
          snow sql -f setup.sql -D ENV=TEST --temporary-connection \
            --account "$(echo $SNOWFLAKE_ACCOUNT)" --user "$(echo $SNOWFLAKE_USER)" \
            --authenticator SNOWFLAKE_JWT --private-key-file key.p8 \
            --role DCM_TEST_DEPLOYER --warehouse FBL_DEMO_WH
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
